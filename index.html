<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #0b1220;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --primary: #6366f1;
            --primary-600: #5457ee;
            --success: #22c55e;
            --danger: #ef4444;
            --ring: rgba(99,102,241,0.35);
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: var(--text);
            background: radial-gradient(1200px 800px at 10% -10%, #1e293b, transparent),
                        radial-gradient(1000px 600px at 110% 10%, #111827, transparent),
                        linear-gradient(180deg, #0b1020 0%, #0a0f1d 100%);
        }
        .calculator {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 420px;
        }
        .calculator h2 {
            margin: 0 0 14px 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }
        .sub {
            margin: 0 0 18px 0;
            color: var(--muted);
            font-size: 0.92rem;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(148,163,184,0.25);
            background: #0a0f1d;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.05s ease;
        }
        input[type="number"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--ring);
        }
        select {
            width: 70px;
            text-align: center;
            appearance: none;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(148,163,184,0.25);
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.06s ease, box-shadow 0.2s ease;
        }
        .btn:hover { background: var(--primary-600); }
        .btn:active { transform: translateY(1px); }
        .btn.secondary {
            background: transparent;
            color: var(--text);
        }
        .result {
            margin-top: 18px;
            font-size: 1.05rem;
            min-height: 52px;
            display: grid;
            align-content: center;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148,163,184,0.22);
            border-radius: 10px;
            color: var(--muted);
        }
        .result .value { font-size: 1.25rem; font-weight: 700; color: var(--text); }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; }
        .badge.success { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.35); }
        .badge.error { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.35); }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Simple Calculator</h2>
        <p class="sub">Enter two numbers, choose an operator, then calculate.</p>
        <form id="calcForm" onsubmit="return false;">
            <div class="row">
                <input type="number" id="num1" required placeholder="First number">
                <select id="operator" aria-label="operator">
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
                <input type="number" id="num2" required placeholder="Second number">
            </div>
            <div class="actions">
                <button class="btn" type="button" onclick="calculate()">Calculate</button>
                <button class="btn secondary" type="button" onclick="clearResult()">Clear</button>
            </div>
        </form>
        <div class="result" id="result"></div>
    </div>
    <script>
        function formatNumber(value) {
            if (typeof value !== 'number' || !isFinite(value)) return String(value);
            const rounded = Math.round((value + Number.EPSILON) * 1e6) / 1e6;
            return rounded.toString();
        }

        function setResult(contentHtml) {
            var resultEl = document.getElementById('result');
            resultEl.innerHTML = contentHtml;
        }

        function clearResult() {
            setResult('');
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('num1').focus();
        }

        function calculate() {
            var num1Raw = document.getElementById('num1').value;
            var num2Raw = document.getElementById('num2').value;
            var num1 = parseFloat(num1Raw);
            var num2 = parseFloat(num2Raw);
            var op = document.getElementById('operator').value;

            if (num1Raw === '' || num2Raw === '' || isNaN(num1) || isNaN(num2)) {
                setResult('<span class="badge error">Error</span> <span class="muted">Please enter two valid numbers.</span>');
                return;
            }

            var computed;
            switch(op) {
                case '+':
                    computed = num1 + num2;
                    break;
                case '-':
                    computed = num1 - num2;
                    break;
                case '*':
                    computed = num1 * num2;
                    break;
                case '/':
                    if (num2 === 0) {
                        setResult('<span class="badge error">Error</span> <span class="muted">Cannot divide by zero.</span>');
                        return;
                    }
                    computed = num1 / num2;
                    break;
                default:
                    setResult('<span class="badge error">Error</span> <span class="muted">Invalid operator.</span>');
                    return;
            }

            var eq = `${formatNumber(num1)} ${op} ${formatNumber(num2)} =`;
            var val = formatNumber(computed);
            setResult(`<span class="badge success">Result</span> <span class="muted">${eq}</span> <span class="value">${val}</span>`);
        }

        document.getElementById('calcForm').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                calculate();
            }
        });
    </script>
</body>
</html>
